apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchard-ingress
  namespace: orchard
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  rules:
    - host: orchard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchard-service
                port:
                  number: 80
