apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchard
  namespace: orchard
  labels:
    app: orchard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchard
  template:
    metadata:
      labels:
        app: orchard
    spec:
      containers:
        - name: orchard
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 80
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ORCHARD_BASE_URL
              value: "{{ORCHARD_BASE_URL}}"
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: MACHINEKEY_VALIDATION
              valueFrom:
                secretKeyRef:
                  name: orchard-secrets
                  key: machinekey-validation
            - name: MACHINEKEY_DECRYPTION
              valueFrom:
                secretKeyRef:
                  name: orchard-secrets
                  key: machinekey-decryption
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: appdata
              mountPath: /inetpub/wwwroot/App_Data
      volumes:
        - name: appdata
          emptyDir: {}
